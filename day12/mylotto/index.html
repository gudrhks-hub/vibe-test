<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 생성기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- 헤더 -->
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">
        <i class="bi bi-stars text-success"></i> 로또 번호 생성기
      </span>
    </div>
  </nav>

  <main class="container pb-5">
    <!-- 번호 선택 영역 (좌: 고정 / 우: 제외) -->
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <div class="card board-card board-fixed h-100">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold text-primary">
              <i class="bi bi-pin-angle-fill"></i> 고정 번호
            </span>
            <span class="d-flex align-items-center gap-2 small text-secondary">
              <span><span id="fixedCount">0</span>/5</span>
              <button type="button" id="resetFixed" class="btn btn-outline-secondary btn-sm" aria-label="고정 번호 초기화">
                <i class="bi bi-eraser"></i>
              </button>
            </span>
          </div>
          <div class="card-body">
            <div id="fixedBoard" class="num-board"></div>
          </div>
          <div class="card-footer bg-white small text-muted">모든 세트에 포함돼요</div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card board-card board-excluded h-100">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold text-danger">
              <i class="bi bi-slash-circle"></i> 제외 번호
            </span>
            <span class="d-flex align-items-center gap-2 small text-secondary">
              <span><span id="excludedCount">0</span>/39</span>
              <button type="button" id="resetExcluded" class="btn btn-outline-secondary btn-sm" aria-label="제외 번호 초기화">
                <i class="bi bi-eraser"></i>
              </button>
            </span>
          </div>
          <div class="card-body">
            <div id="excludedBoard" class="num-board"></div>
          </div>
          <div class="card-footer bg-white small text-muted">어떤 세트에도 나오지 않아요</div>
        </div>
      </div>
    </div>

    <!-- 생성 버튼 -->
    <button type="button" id="generateBtn" class="btn btn-primary btn-lg w-100 mb-3">
      <i class="bi bi-dice-5"></i> 5세트 생성
    </button>

    <!-- 생성 결과 -->
    <div class="card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span class="fw-semibold">생성 결과</span>
        <button type="button" id="copyAllBtn" class="btn btn-outline-secondary btn-sm d-none">
          <i class="bi bi-copy"></i> 전체 복사
        </button>
      </div>
      <div class="card-body py-2">
        <div id="resultList" aria-live="polite">
          <p class="text-muted text-center my-4">5세트 생성 버튼을 눌러 번호를 만들어 보세요</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 토스트 -->
  <div class="toast-container position-fixed p-3 toast-pos">
    <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div id="appToastBody" class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="닫기"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
