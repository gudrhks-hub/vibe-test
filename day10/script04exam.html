<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" name="" id="num01"> +
    <input type="number" name="" id="num02">
    <span id="result">?</span>
    <button type="button" onclick="add();">결과</button>
</body>
<script>
function add() {
    const num01 = document.getElementById('num01').value;
    const num02 = document.getElementById('num02').value;
    const result = Number(num01) + Number(num02);
    const resultspan = document.getElementById('result');
    resultspan.textContent = result;


}
</script>
</html>
