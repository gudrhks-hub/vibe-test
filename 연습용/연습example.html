<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인박스 만들기</title>
    <style>
    .container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        height: 100vh;
        
       
    }
    .login-box{
        /*선그리기 : 두께 선모양 색상*/
        border: 1px solid black;
        width: 400px;                       
        height: 350px;
        border-radius: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: aquamarine;
        /* border: 테두리 두께
           width: 박스의 가로 길이
           height: 박스의 세로 길이
           border-radius : 모서리 조절 높을수록 원형으로 변함
           display:flex :정렬을 한다
           flex-direction-column: 내용물을 세로로 쌓다
            */
    }
    .title{
        text-align: center;
        font-size: 30px;
        font-weight: normal;
        margin-bottom: 10px;
        color: blue; 
              /*  */
    }
    input {
        width: 300px;
        height: 40px;
        border-radius: 2px;
        border: 0;
        border-bottom: 1px solid black;
        outline: 10;
        margin-top: 10px;
        /* 입력칸
        border=0 테두리 없앰
        border-bottom =테두리 아래쪽 부분
        outline : 클릭했을때 생기는 테두리 부분
        margin-top : 입력칸 사이의 위쪽  */
    }
    .btn-group{                    
        width: 300px;
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        /* 로그인/찾기/회원가입 버튼
         justify-content : space-betwnnm; = 양 끝에 붙이고, 남은 공간은 사이에 똑같이 나누기 */
    }
    .ok-btn{
        width: 90px;
        height: 40px;
        font-size: 20px;
        font-weight: bold;
        color : white;
        background-color: beige;
        border: 0;
        border-radius: 5px;
    }
    .find-btn{                     
        width: auto;
        padding: 0 15px;
        white-space: nowrap;
        /* white-space=띄어쓰기,빈칸을 어떻게 처리 할것인지
        nowrap=안바꿈을 의미 */
        font-size: 15px;
        color: aqua;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="title">
                Login
            </div>
            <div>
                <input type="text" placeholder="ID">

            </div>
            <div>
                <input type="password" placeholder="password">
            </div>
            <div class="btn-group">
                <button type="button" class="ok-btn find-btn">로그인</button>
                <button type="button" class="ok-btn find-btn">아이디/비번찾기</button>
                <button type="button" class="ok-btn find-btn">회원가입</button>
            </div>
                

            </div>

        </div>

    </div>
</body>
</html>
